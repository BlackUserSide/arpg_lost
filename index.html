<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ARPG Lost</title>
    <meta name="theme-color" content="#0b0a0e" />
    <!-- Home-screen web app: the way to drop the browser bars on iPhone Safari (no element full screen there). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARPG Lost" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0a0e; overflow: hidden; }
      /* #shell is the full-screen target (scale config fullscreenTarget): the canvas and DOM overlays live inside it.
         On iOS render/viewport.ts sets its width / height in px (iOS can keep a stale, taller layout box). */
      #shell { position: fixed; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; background: #0b0a0e; }
      /* viewport-fit=cover lets the page reach under the notch / status bar / home indicator: the game itself keeps to
         the safe area (render/touchMode.ts safeInsets() then reports no extra insets). */
      #game {
        position: absolute;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        overflow: hidden;
        /* No browser gestures (scroll, zoom, text selection, callouts) on the game: touch is game input. */
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      /* Preloader (render/preloader.ts drives it once the bundle runs): inline so it shows before any download. Fonts
         may not be in yet: the stacks fall back to system serif / sans. Above the canvas, below the rotate cover (1000). */
      #boot {
        position: absolute; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background: radial-gradient(ellipse at 50% 60%, #1c1418 0%, #0a090c 65%); color: #efe6d2;
        font: 14px 'PT Sans', 'Trebuchet MS', sans-serif; transition: opacity 0.35s ease-out;
        user-select: none; -webkit-user-select: none; touch-action: none;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .box { width: min(440px, 72vw); text-align: center; }
      #boot h1 {
        margin: 0 0 0.35em; font: 700 clamp(30px, 9vmin, 56px)/1 'Cormorant SC', Georgia, 'Times New Roman', serif;
        font-variant: small-caps; letter-spacing: 0.04em; color: #f3d58a; text-shadow: 0 0 18px rgba(255, 122, 42, 0.35), 0 2px 3px #000;
      }
      #boot .rule { height: 1px; margin: 0 auto clamp(14px, 5vmin, 30px); width: 70%; background: linear-gradient(90deg, transparent, #d9a94a, transparent); }
      #boot .bar { position: relative; height: 10px; border: 1px solid #d9a94a; background: #120e12; box-shadow: 0 0 0 2px #000, 0 0 0 3px #2b2420, inset 0 1px 4px #000; }
      #boot .fill {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0%; transition: width 0.25s ease-out;
        background: linear-gradient(90deg, #7a4a16, #d9a94a 70%, #f3d58a); box-shadow: 0 0 10px rgba(255, 122, 42, 0.55);
      }
      #boot .edge { position: absolute; right: -3px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #fff3c8; box-shadow: 0 0 8px 3px #ff7a2a; }
      #boot .edge i {
        position: absolute; left: 2px; top: 2px; width: 3px; height: 3px; border-radius: 50%; background: #ffb35a; opacity: 0;
        box-shadow: 0 0 4px #ff7a2a; animation: boot-spark 1.1s ease-out infinite; animation-delay: var(--d);
      }
      @keyframes boot-spark {
        0% { opacity: 1; transform: translate(0, 0) scale(1); }
        100% { opacity: 0; transform: translate(var(--x), -26px) scale(0.3); }
      }
      #boot .pct { margin-top: 10px; color: #d9a94a; font-weight: 700; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
      @media (prefers-reduced-motion: reduce) { #boot .edge i { animation: none; } #boot .fill { transition: none; } }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="game"></div>
      <div id="boot" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="box">
          <h1>ARPG Lost</h1>
          <div class="rule"></div>
          <div class="bar"><div class="fill"><div class="edge"><i style="--x:-9px;--d:0s"></i><i style="--x:6px;--d:.35s"></i><i style="--x:-3px;--d:.7s"></i><i style="--x:10px;--d:.9s"></i></div></div></div>
          <div class="pct">0%</div>
        </div>
      </div>
    </div>
    <script>
      // Bundle download / parse has no progress events: creep towards 30% until render/preloader.ts takes over.
      (function () {
        var b = document.getElementById('boot'), p = 0;
        b.dataset.timer = String(setInterval(function () {
          p += (30 - p) * 0.05;
          b.querySelector('.fill').style.width = p.toFixed(1) + '%';
          b.querySelector('.pct').textContent = Math.floor(p) + '%';
        }, 100));
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
